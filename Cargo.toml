[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
# Ratatui 0.30.2 and its ratatui-core/ratatui-widgets crates declare Rust 1.88 as
# their MSRV. The workspace builds on 1.88; this floor is dependency evidence, not taste.
rust-version = "1.88"
repository = "https://github.com/iseif/termesh"
description = "Internal component of a terminal-native, agent-first IDE."
# Inherited by every crate: the internal ones are published only because the binary
# depends on them, and a crates.io page with no body cannot tell a reader that. The
# path is resolved against this file, so each package gets its own copy of the README.
readme = "README.md"

[workspace.dependencies]
# --- internal crates ---
termesh-core   = { version = "0.1.0", path = "crates/core" }
termesh-editor = { version = "0.1.0", path = "crates/editor" }
termesh-agent  = { version = "0.1.0", path = "crates/agent" }
termesh-ui     = { version = "0.1.0", path = "crates/ui" }
termesh-config = { version = "0.1.0", path = "crates/config" }
termesh-filesystem = { version = "0.1.0", path = "crates/filesystem" }
termesh-git        = { version = "0.1.0", path = "crates/git" }
termesh-lsp        = { version = "0.1.0", path = "crates/lsp" }
termesh-workspace  = { version = "0.1.0", path = "crates/workspace" }
termesh-platform   = { version = "0.1.0", path = "crates/platform" }
termesh-syntax     = { version = "0.1.0", path = "crates/syntax" }
termesh-terminal   = { version = "0.1.0", path = "crates/terminal" }
termesh-search     = { version = "0.1.0", path = "crates/search" }
termesh-tasks      = { version = "0.1.0", path = "crates/tasks" }
termesh-test-support = { version = "0.1.0", path = "crates/test-support" }

# --- intended external toolkit (declared for reference; wired in from Phase 01+,
#     so no member depends on these yet and the Phase-00 build stays offline/green) ---
thiserror     = "1"
anyhow        = "1"
tracing       = "0.1"
serde         = { version = "1", features = ["derive"] }
toml          = "0.8"
toml_edit     = "0.22"
serde_json    = "1"
ratatui       = { version = "0.30", features = ["crossterm_0_29"] }
crossterm     = "0.29"
tokio         = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "process", "sync", "time"] }
ropey         = "1"
portable-pty  = "0.9"
nix           = { version = "0.29", features = ["signal"] }
alacritty_terminal = "0.26"
base64       = "0.22"
notify        = "6"
ignore        = "0.4"
unicode-width = "0.2"
similar       = "3"
tree-sitter   = "0.26"
tree-sitter-highlight = "0.26"
tree-sitter-rust = "0.24"

[profile.release]
lto = "thin"
codegen-units = 1
