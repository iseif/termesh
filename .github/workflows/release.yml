name: Release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

jobs:
  unix:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15

    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml pins `stable` for contributors, and rustup honours the file over
      # the toolchain this workflow asked for — so release builds silently ran on stable, and
      # the cross target installed for 1.88.0 was not there when cargo looked. Release builds
      # want the pin, so the file goes.
      - name: Use the pinned release toolchain, not the contributor default
        # Explicit shell: the Windows runner defaults to PowerShell, where `rm` aliases
        # Remove-Item and `-f` is ambiguous with -Filter.
        shell: bash
        run: rm -f rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install the Linux ARM linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install --yes gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --locked --target "${{ matrix.target }}" -p termesh

      - name: Strip
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            aarch64-linux-gnu-strip "target/${{ matrix.target }}/release/termesh"
          else
            strip "target/${{ matrix.target }}/release/termesh"
          fi

      - name: Detect macOS signing credentials
        id: macos-credentials
        if: ${{ startsWith(matrix.target, 'x86_64-apple-') || startsWith(matrix.target, 'aarch64-apple-') }}
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        shell: bash
        run: |
          # All six or none. Signing without notarizing is the dangerous middle: it
          # produces a binary that Gatekeeper still refuses, from a green run, so the one
          # state that looks finished without being finished is the one to refuse.
          missing=()
          present=()
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD MACOS_SIGNING_IDENTITY \
                      APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            if [[ -n "${!name}" ]]; then present+=("$name"); else missing+=("$name"); fi
          done

          if (( ${#present[@]} == 0 )); then
            echo "No macOS signing credentials set — shipping unsigned (docs/support.md)."
            echo "signing=false" >> "$GITHUB_OUTPUT"
            echo "notarization=false" >> "$GITHUB_OUTPUT"
          elif (( ${#missing[@]} == 0 )); then
            echo "signing=true" >> "$GITHUB_OUTPUT"
            echo "notarization=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::macOS signing is half configured. Set all six secrets or none." \
                 "Missing: ${missing[*]}"
            exit 1
          fi

      - name: Import the macOS signing certificate
        if: steps.macos-credentials.outputs.signing == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          certificate="$RUNNER_TEMP/termesh-signing.p12"
          keychain="$RUNNER_TEMP/termesh-signing.keychain-db"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p runner "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p runner "$keychain"
          security import "$certificate" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k runner "$keychain"

      - name: Sign the macOS binary
        if: steps.macos-credentials.outputs.signing == 'true'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        shell: bash
        run: codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "target/${{ matrix.target }}/release/termesh"

      - name: Notarize the macOS binary
        if: steps.macos-credentials.outputs.notarization == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        shell: bash
        run: |
          ditto -c -k --keepParent "target/${{ matrix.target }}/release/termesh" "$RUNNER_TEMP/termesh-notarization.zip"
          xcrun notarytool submit "$RUNNER_TEMP/termesh-notarization.zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait

      - name: Package
        shell: bash
        run: |
          package="termesh-${{ matrix.target }}"
          mkdir -p "$package"
          cp "target/${{ matrix.target }}/release/termesh" "$package/"
          cp LICENSE-MIT LICENSE-APACHE "$package/"
          tar -czf "$package.tar.gz" "$package"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$package.tar.gz" > SHA256SUMS
          else
            shasum -a 256 "$package.tar.gz" > SHA256SUMS
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: termesh-${{ matrix.target }}
          path: |
            termesh-${{ matrix.target }}.tar.gz
            SHA256SUMS
          if-no-files-found: error

  windows:
    name: x86_64-pc-windows-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml pins `stable` for contributors, and rustup honours the file over
      # the toolchain this workflow asked for — so release builds silently ran on stable, and
      # the cross target installed for 1.88.0 was not there when cargo looked. Release builds
      # want the pin, so the file goes.
      - name: Use the pinned release toolchain, not the contributor default
        # Explicit shell: the Windows runner defaults to PowerShell, where `rm` aliases
        # Remove-Item and `-f` is ambiguous with -Filter.
        shell: bash
        run: rm -f rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc -p termesh

      - name: Detect Windows signing credentials
        id: windows-credentials
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          if ($env:WINDOWS_CERTIFICATE -and $env:WINDOWS_CERTIFICATE_PASSWORD) {
            "signing=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            "signing=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Sign the Windows binary
        if: steps.windows-credentials.outputs.signing == 'true'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP "termesh-signing.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $imported = Import-PfxCertificate -FilePath $certificate -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $imported) { throw "the signing certificate could not be imported" }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe was not found" }
          & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /sha1 $imported.Thumbprint "target\x86_64-pc-windows-msvc\release\termesh.exe"

      - name: Package
        shell: pwsh
        run: |
          $package = "termesh-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Path $package | Out-Null
          Copy-Item "target\x86_64-pc-windows-msvc\release\termesh.exe" $package
          Copy-Item LICENSE-MIT, LICENSE-APACHE $package
          Compress-Archive -Path $package -DestinationPath "$package.zip"
          $hash = (Get-FileHash "$package.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          # WriteAllText, not Set-Content: Set-Content terminates the line with CRLF, and a
          # checksum file whose filename carries a trailing \r makes `sha256sum -c` report
          # "No such file or directory" on every Unix system. Downloaders verify on Linux.
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD "SHA256SUMS"), "$hash  $package.zip`n")

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: termesh-x86_64-pc-windows-msvc
          path: |
            termesh-x86_64-pc-windows-msvc.zip
            SHA256SUMS
          if-no-files-found: error
