name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features
      - name: Test
        run: cargo test --workspace --all-features
      - name: Build
        run: cargo build --workspace

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # cargo-deny runs inside its own musl container and only reads Cargo.lock and
      # deny.toml — it needs no toolchain of ours. Left in place, rust-toolchain.toml makes
      # rustup try to install `stable-x86_64-unknown-linux-musl` in that container, which
      # fails before the audit starts. Removing it from the checkout is scoped to this job.
      - name: Drop the toolchain pin for the audit container
        run: rm -f rust-toolchain.toml
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
