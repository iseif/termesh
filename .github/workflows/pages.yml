name: Landing page

on:
  push:
    branches: [main]
    # The page only restates the README and renders frames from the binary, so it does not
    # need rebuilding when unrelated code changes.
    paths:
      - "site/**"
      - "scripts/build-site.sh"
      - ".github/workflows/pages.yml"
      - "Cargo.toml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A superseded deploy is of no interest, but never cancel one mid-flight: that can leave
# the Pages deployment half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No toolchain: the page is static HTML plus committed images. It used to render a
      # frame by running the binary, which cost a release build on every deploy.
      - name: Render the page
        run: ./scripts/build-site.sh
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/_build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
